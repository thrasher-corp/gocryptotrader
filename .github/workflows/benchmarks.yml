name: benchmarks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: 1.27.x

jobs:
  gate:
    name: allocation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check allocations against baseline
        run: make bench BENCH_OUT=bench-output.txt

      # Uploaded whether or not the check passed. A contributor away from linux/amd64 folds it into
      # the baseline with 'make bench_apply', and it is the only record of a run's ns/op.
      - name: Upload benchmark output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-output
          path: bench-output.txt
          if-no-files-found: ignore
