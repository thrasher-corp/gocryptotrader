on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
      - 'dependabot/**'
  pull_request:
name: CI
permissions:
  contents: read
concurrency:
  # Master pushes each get their own group, because a queued run is cancelled when
  # a newer one joins its group whatever cancel-in-progress says, which would leave
  # master commits without a verdict. Every other run, a push to a fork's branch
  # included, supersedes the older runs for its ref.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  backend:
    name: GoCryptoTrader (${{ matrix.os }}, ${{ matrix.goarch }}, psql=${{ matrix.psql }}, skip_wrapper_tests=${{ matrix.skip_wrapper_tests}}, sonic=${{ matrix.sonic }}, udecimal=${{ matrix.udecimal }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            psql: true
            skip_wrapper_tests: false
            sonic: false
            udecimal: false
          - os: ubuntu-latest
            goarch: 386
            psql: true
            skip_wrapper_tests: true
            sonic: false
            udecimal: false
          - os: ubuntu-24.04-arm
            goarch: arm64
            psql: false # Not supported
            skip_wrapper_tests: true
            sonic: false
            udecimal: false
          - os: macos-latest
            goarch: arm64
            psql: true
            skip_wrapper_tests: true
            sonic: false
            udecimal: false
          - os: windows-latest
            goarch: amd64
            psql: true
            skip_wrapper_tests: true
            sonic: false
            udecimal: false
          - os: ubuntu-latest
            goarch: amd64
            psql: true
            skip_wrapper_tests: false
            sonic: true # Only test sonic on linux/amd64 since too many races and fatals across other archs and OS
            udecimal: false
          - os: ubuntu-latest
            goarch: amd64
            psql: true
            skip_wrapper_tests: false
            sonic: true
            udecimal: true

    runs-on: ${{ matrix.os }}

    steps:
    - name: Setup Postgres
      if: matrix.psql == true
      uses: ikalnytskyi/action-setup-postgres@v8
      with:
        database: gct_dev_ci
      id: postgres

    - name: Set up Postgres environment
      if: matrix.psql == true
      run: |
        {
          echo "PSQL_USER=postgres"
          echo "PSQL_PASS=postgres"
          echo "PSQL_HOST=localhost"
          echo "PSQL_DBNAME=gct_dev_ci"
          echo "PSQL_TESTDBNAME=gct_dev_ci"
          echo "PSQL_SSLMODE=disable"
          echo "PSQL_SKIPSQLCMD=true"
        } >> "$GITHUB_ENV"
      shell: bash

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Record Go cache key
      run: echo "${{ matrix.goarch }}-sonic=${{ matrix.sonic }}-udecimal=${{ matrix.udecimal }}" > .go-cache-key
      shell: bash

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          .go-cache-key

    - name: Skip additional wrapper CI tests
      if: matrix.skip_wrapper_tests == true
      run: |
        echo "SKIP_WRAPPER_CI_TESTS=true" >> "$GITHUB_ENV"
      shell: bash

    - name: Additional steps for 386 architecture
      if: matrix.goarch == '386'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
      shell: bash

    - name: Set CGO_ENABLED for 386 and macos-latest
      if: matrix.goarch == '386' || matrix.os == 'macos-latest'
      run: |
        echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
      shell: bash

    - name: Set GOFLAGS
      run: |
        tags=()
        if [ "${{ matrix.sonic }}" = "true" ]; then
          tags+=(sonic_on)
        fi
        if [ "${{ matrix.udecimal }}" = "true" ]; then
          tags+=(udecimal_on)
        fi
        if [ "${#tags[@]}" -gt 0 ]; then
          tags_csv=$(IFS=,; echo "${tags[*]}")
          echo "GOFLAGS=${GOFLAGS} -tags=${tags_csv}" >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Test
      run: | # PGSERVICEFILE isn't supported by lib/pq and will cause a panic if set
        unset PGSERVICEFILE
        if [ "${{ matrix.goarch }}" = "386" ]; then
          go test -count=1 -coverprofile coverage.txt -covermode atomic ./...
        else
          go test -race -count=1 -coverprofile coverage.txt -covermode atomic ./...
        fi
      shell: bash
      env:
        GOARCH: ${{ matrix.goarch }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend-live-test-build:
    name: GoCryptoTrader mock_test_off build (ubuntu-latest, amd64, psql=false, sonic=false)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Record Go cache key
      run: echo "mock_test_off" > .go-cache-key
      shell: bash

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          .go-cache-key

    # -exec=/bin/true links each test binary without running it. Running them would
    # still run every TestMain, and some of those call live exchange APIs.
    - name: Build tests with mock_test_off
      run: |
        go test -run=^$ -exec=/bin/true -tags=mock_test_off ./...
      shell: bash
  
  backend-docker:
    name: GoCryptoTrader docker (ubuntu-latest, amd64, psql=false, skip_wrapper_tests=true, sonic=false)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Docker buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Resolve Go image digest
      id: go-image
      run: |
        image="golang:$(awk '$1 == "go" { print $2; exit }' go.mod)"
        digest=$(docker buildx imagetools inspect --raw "$image" |
          jq -r 'first(.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")) | .digest')
        if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "could not resolve $image for linux/amd64" >&2
          exit 1
        fi
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore Docker layers
      id: docker-cache
      uses: actions/cache/restore@v6
      with:
        path: /tmp/.docker-buildx-cache
        key: ${{ runner.os }}-docker-buildx-${{ fromJSON(steps.buildx.outputs.nodes)[0].buildkit }}-${{ steps.go-image.outputs.digest }}-${{ hashFiles('./.github/workflows/amd64.Dockerfile', 'go.mod', 'go.sum') }}
        restore-keys: |
          ${{ runner.os }}-docker-buildx-${{ fromJSON(steps.buildx.outputs.nodes)[0].buildkit }}-${{ steps.go-image.outputs.digest }}-
    
    - name: Build Docker image
      env:
        GO_DIGEST: ${{ steps.go-image.outputs.digest }}
      run: |
        docker buildx build \
          --load \
          --build-arg GO_VERSION="$(awk '$1 == "go" { print $2; exit }' go.mod)@$GO_DIGEST" \
          --cache-to=type=local,dest=/tmp/.docker-buildx-cache-new,mode=max \
          --cache-from=type=local,src=/tmp/.docker-buildx-cache \
          --tag gct-backend-amd64 \
          -f ./.github/workflows/amd64.Dockerfile \
          .

    - name: Move Docker cache
      run: |
        rm -rf /tmp/.docker-buildx-cache
        mv /tmp/.docker-buildx-cache-new /tmp/.docker-buildx-cache

    - name: Save Docker layers
      if: steps.docker-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: /tmp/.docker-buildx-cache
        key: ${{ steps.docker-cache.outputs.cache-primary-key }}
    
    - name: Run Docker image
      run: |
        docker run --env SKIP_WRAPPER_CI_TESTS=true --env CI=true --env GCT_DOCKER_CI=true --rm gct-backend-amd64
