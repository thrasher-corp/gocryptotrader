name: golangci-lint
on: [push, pull_request]
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: golangci-lint (udecimal)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags=udecimal_on
