name: misc
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    name: miscellaneous checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Run miscellaneous checks
      run: ./scripts/misc_checks.sh

    - name: Lint Markdown
      run: make markdownlint
