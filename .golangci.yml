version: "2"
run:
  issues-exit-code: 1
  tests: true

linters:
  default: none
  enable:
# defaults
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

# disabled by default linters
#   - arangolint
#   - asasalint
    - asciicheck
    - bidichk
    - bodyclose
#   - canonicalheader
#   - clickhouselint
    - containedctx
#   - contextcheck
    - copyloopvar
#   - cyclop
    - decorder
    - depguard
    - dogsled
#   - dupl
    - dupword
    - durationcheck
#   - embeddedstructfieldcheck
#   - err113
    - errchkjson
    - errname
#   - errorlint
#   - exhaustive
#   - exhaustruct
#   - exhaustruct_v5
#   - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
#   - funcorder
#   - funlen
#   - ginkgolinter
    - gocheckcompilerdirectives
#   - gochecknoglobals
#   - gochecknoinits
    - gochecksumtype
#   - gocognit
    - goconst
    - gocritic
#   - gocyclo
#   - godoclint
#   - godot
#   - godox
#   - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
#   - gosmopolitan
    - grouper
    - iface
#   - importas
#   - inamedparam
#   - interfacebloat
#   - iotamixing
    - intrange
#   - ireturn
#   - lll
#   - loggercheck
#   - maintidx
    - makezero
    - mirror
    - misspell
#   - mnd
    - modernize
#   - musttag
#   - nakedret
#   - nestif
    - nilerr
    - nilnesserr
#   - nilnil
#   - nlreturn
    - noctx
#   - noinlineerr
    - nolintlint
#   - nonamedreturns
    - nosprintfhostport
#   - paralleltest
    - perfsprint
    - prealloc
    - predeclared
#   - promlinter
#   - protogetter
    - reassign
#   - recvcheck
    - revive
    - rowserrcheck
#   - sloglint
#   - spancheck
    - sqlclosecheck
    - tagalign
#   - tagliatelle
    - testableexamples
    - testifylint
#   - testpackage
#   - unqueryvet
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
#   - varnamelen
    - wastedassign
    - whitespace
#   - wrapcheck
#   - wsl_v5
#   - zerologlint
#   - wsl // Deprecated 

  settings:
    depguard:
      rules:
        prevent_stdlib_log_use:
          list-mode: lax
          files:
            - '**/exchanges/**'
            - '**/exchange/**'
            - '!$test'
            # test infrastructure that aborts the run on a malformed fixture or missing credentials
            - '!**/exchanges/mock/**'
            - '!**/internal/**'
          allow:
            - github.com/thrasher-corp/gocryptotrader/log
          deny:
            - pkg: log
              desc: Please use github.com/thrasher-corp/gocryptotrader/log so output honours the configured logger, level and output paths.
        prevent_json_package_use:
          list-mode: lax
          files:
            - $all
          allow:
            - github.com/thrasher-corp/gocryptotrader/encoding/json
          deny:
            - pkg: encoding/json
              desc: Please use the custom JSON package github.com/thrasher-corp/gocryptotrader/encoding/json instead of encoding/json to allow sonic/json switching.
        prevent_decimal_package_use:
          list-mode: lax
          files:
            - $all
          allow:
            - github.com/thrasher-corp/gocryptotrader/types/decimal
          deny:
            - pkg: github.com/shopspring/decimal
              desc: Please use github.com/thrasher-corp/gocryptotrader/types/decimal to allow decimal backend switching.
            - pkg: github.com/quagmt/udecimal
              desc: Please use github.com/thrasher-corp/gocryptotrader/types/decimal to allow decimal backend switching.
    goconst:
      min-occurrences: 6
      # Repeated fixture strings in tests are not a maintenance hazard, and occurrence
      # counting spans files so this cannot be expressed as an exclusion rule
      ignore-tests: true
    gosec:
      excludes:
        - G602 # False positives, see https://github.com/golangci/golangci-lint/issues/6334
    gocritic:
      disabled-checks:
        - wrapperFunc
        - methodExprCall
        - evalOrder
      enabled-tags:
        - performance
        - style
        - experimental
    govet:
      enable:
        - shadow
        - nilness
        - unusedwrite
    staticcheck:
      checks:
        - all
        - '-ST1000' # Disable at least one file in a package should have a package comment check
        - '-QF1005' # Disable expand call to math.Pow check
        - '-QF1008' # Disable embedded field from selector check
    testifylint:
      enable-all: true
      disable:
        - require-error
        - float-compare
         # We deliberately use Equal over Len to avoid spamming the contents of large Slices
        - len
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        text: Expect WriteFile permissions to be 0600 or less
      - linters:
          - govet
        text: 'shadow: declaration of "err" shadows declaration at'
      - linters:
          - govet
        path: _test\.go
        text: 'shadow: declaration of "e" shadows declaration at'
      - linters:
          - gosec
        path: _test\.go
        text: 'G101|G703' # G101 hardcoded credentials, G703 path traversal via taint analysis
      - linters:
          - gosec
        path: exchanges/mock/server\.go
        text: 'G706' # G706 log injection via taint analysis
      - linters:
          - dupword
        path: config/config_encryption_test\.go
        # The encryption prompts are driven by scripted stdin that deliberately repeats answers
      - linters:
          - revive
        text: 'should have a package comment'
      - linters:
          - revive
        text: "var-naming: avoid meaningless package names"
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library package names"
      - linters:
          - forbidigo
        # Command line entrypoints: stdout is the interface, not a stray debug print
        path: '^(cmd/|backtester/btcli/|backtester/config/strategyconfigbuilder/|backtester/main\.go|main\.go)'
    paths:
      - vendor
      - web/
      - testdata
      - database/models/
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        # extra-rules previously enabled both of these; balance-calls is new in gofumpt v0.11
        # and would reformat 28 files, so it is deliberately left off for a separate change
        group-params: true
        clothe-returns: true
  exclusions:
    generated: lax
    paths:
      - vendor
      - web/
      - testdata
      - database/models/
      - third_party$
      - builtin$
      - examples$
