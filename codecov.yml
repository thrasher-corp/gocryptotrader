codecov: 
  require_ci_to_pass: true
comment: 
  behavior: default
  layout: "reach,diff,flags,tree"
  require_changes: false
coverage: 
  precision: 2
  range: "70...100"
  round: down
github_checks: 
  annotations: false
ignore:
  # Generated by protoc from the MEXC websocket .proto definitions. Go only instruments the
  # package under test, and a generated package carries no tests of its own, so these files
  # can never report as covered and would otherwise count against every diff that touches them.
  - "exchanges/mexc/mexc_proto_types"
parsers: 
  gcov: 
    branch_detection: 
      conditional: true
      loop: true
      macro: false
      method: false
